# Cloudflare Pages static output. No account id or API token here —
# connect the GitHub repo in the Pages dashboard, or set
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in GitHub to use workflow_dispatch.

name = "ancient-lens"
compatibility_date = "2025-07-15"
pages_build_output_dir = ".output/public"

[vars]
NUXT_PUBLIC_SITE_URL = "https://ancientlens.info"
NUXT_SITE_URL = "https://ancientlens.info"
